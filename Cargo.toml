[package]
name = "car-go-clean"
version = "0.4.1"
edition = "2021"
rust-version = "1.95"
description = "Periodically run cargo clean on Rust projects and track reclaimed disk space."
license = "MIT"
homepage = "https://github.com/dcchuck/car-go-clean"
repository = "https://github.com/dcchuck/car-go-clean"
readme = "README.md"

[package.metadata.dist]
dist = true

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
humantime-serde = "1.1"
humantime = "2.3"
ignore = "0.4"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
sysinfo = "0.39.1"
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
yaml-rust2 = "0.11"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
