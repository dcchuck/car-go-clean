name: Publish Homebrew formula pull request

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish-homebrew-formula:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      PLAN: ${{ inputs.plan }}
      TAP_REPOSITORY: dcchuck/homebrew-tap
    steps:
      - name: Read release metadata
        run: |
          TAG="$(jq -er '.announcement_tag | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<< "$PLAN")"
          VERSION="${TAG#v}"
          BRANCH="formula/car-go-clean-$TAG"
          printf 'TAG=%s\nVERSION=%s\nBRANCH=%s\n' "$TAG" "$VERSION" "$BRANCH" >> "$GITHUB_ENV"
      - name: Require tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$HOMEBREW_TAP_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download release checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: dist-artifacts
          merge-multiple: true
      - name: Render standards-compliant formula
        run: |
          mkdir -p generated-formula
          scripts/render-homebrew-formula.sh \
            "$TAG" \
            dist-artifacts \
            generated-formula/car-go-clean.rb
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dcchuck/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          fetch-depth: 0
          persist-credentials: true
      - name: Commit formula on the release branch
        working-directory: homebrew-tap
        run: |
          DEFAULT_BRANCH="$(gh repo view "$TAP_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          test -n "$DEFAULT_BRANCH"
          test "$BRANCH" != "$DEFAULT_BRANCH"
          TAP_MAIN_SHA="$(
            gh api \
              "repos/$TAP_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" \
              --jq '.object.sha'
          )"
          printf '%s\n' "$TAP_MAIN_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git fetch origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          test "$(git rev-parse "origin/$DEFAULT_BRANCH")" = "$TAP_MAIN_SHA"
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git switch --create "$BRANCH" --track "origin/$BRANCH"
            test "$(git merge-base HEAD "origin/$DEFAULT_BRANCH")" = "$TAP_MAIN_SHA"
            EXISTING_DIFF="$(git diff --name-only "origin/$DEFAULT_BRANCH...HEAD")"
            case "$EXISTING_DIFF" in
              ''|Formula/car-go-clean.rb) ;;
              *)
                echo "existing release branch contains unrelated changes:" >&2
                printf '%s\n' "$EXISTING_DIFF" >&2
                exit 1
                ;;
            esac
          else
            git switch --create "$BRANCH" "origin/$DEFAULT_BRANCH"
          fi
          mkdir -p Formula
          cp ../generated-formula/car-go-clean.rb Formula/car-go-clean.rb
          git config user.name "car-go-clean release bot"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/car-go-clean.rb
          if ! git diff --cached --quiet; then
            git commit -m "car-go-clean $VERSION"
          fi
          test "$(git merge-base HEAD "origin/$DEFAULT_BRANCH")" = "$TAP_MAIN_SHA"
          FINAL_DIFF="$(git diff --name-only "origin/$DEFAULT_BRANCH...HEAD")"
          case "$FINAL_DIFF" in
            ''|Formula/car-go-clean.rb) ;;
            *)
              echo "release branch contains unrelated changes:" >&2
              printf '%s\n' "$FINAL_DIFF" >&2
              exit 1
              ;;
          esac
          test "$(
            gh api \
              "repos/$TAP_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" \
              --jq '.object.sha'
          )" = "$TAP_MAIN_SHA"
          test "$(
            git ls-remote origin "refs/heads/$DEFAULT_BRANCH" |
              awk 'NR == 1 { print $1 }'
          )" = "$TAP_MAIN_SHA"
          git push --set-upstream origin "HEAD:refs/heads/$BRANCH"
          printf 'DEFAULT_BRANCH=%s\n' "$DEFAULT_BRANCH" >> "$GITHUB_ENV"
      - name: Open or update formula pull request
        working-directory: homebrew-tap
        run: |
          TITLE="car-go-clean $VERSION"
          BODY="Updates Formula/car-go-clean.rb for car-go-clean $TAG."
          PR_NUMBER="$(gh pr list --repo "$TAP_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --repo "$TAP_REPOSITORY" --title "$TITLE" --body "$BODY"
          elif git diff --quiet "origin/$DEFAULT_BRANCH...HEAD" -- Formula/car-go-clean.rb; then
            echo "Formula is already current on $DEFAULT_BRANCH"
          else
            gh pr create --repo "$TAP_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
