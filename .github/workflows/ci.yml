name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.95.0"
      - name: Install verified dist
        run: scripts/install-cargo-dist.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run locked tests
        run: cargo test --locked
      - name: Check shell installer
        run: make test-installer
      - name: Check upgrade helper
        run: make test-upgrade
      - name: Check release notes
        run: make test-release-notes
      - name: Check shared release scripts
        run: make test-release-scripts
      - name: Plan release artifacts
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "car-go-clean").version')"
          dist plan --tag "v$VERSION" --output-format=json
