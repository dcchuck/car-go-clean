name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run locked tests
        run: cargo test --locked
      - name: Check shell installer
        run: make test-installer
      - name: Check release notes
        run: make test-release-notes
      - name: Plan release artifacts
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "car-go-clean").version')"
          dist plan --tag "v$VERSION" --output-format=json
