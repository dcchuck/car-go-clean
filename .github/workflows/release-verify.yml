name: Verify commit-bound draft

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    outputs:
      release_id:
        description: Numeric ID of the authenticated commit-bound draft
        value: ${{ jobs.inventory.outputs.release_id }}

permissions:
  # GitHub requires contents:write for workflow tokens to read draft releases.
  contents: write

jobs:
  inventory:
    name: Verify draft identity and inventory
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.inventory.outputs.release_id }}
    steps:
      - id: inventory
        name: Verify commit-bound draft inventory
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ inputs.plan }}
        run: |
          set -eu
          TAG="$(jq -er '.announcement_tag | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<< "$PLAN")"
          # Dollar-prefixed names in this query are GraphQL variables.
          # shellcheck disable=SC2016
          QUERY='
            query VerifiedDraft($owner: String!, $name: String!, $tagName: String!) {
              repository(owner: $owner, name: $name) {
                release(tagName: $tagName) {
                  databaseId
                  isDraft
                  isPrerelease
                  isLatest
                  tagName
                  tagCommit {
                    oid
                  }
                }
              }
            }'
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          DISCOVERY="$(
            gh api graphql \
              -f query="$QUERY" \
              -F owner="$OWNER" \
              -F name="$NAME" \
              -F tagName="$TAG"
          )"
          jq -e '
            .errors == null and
            (.data.repository.release | type == "object") and
            (.data.repository.release.databaseId | type == "number") and
            .data.repository.release.isDraft == true and
            .data.repository.release.isPrerelease == false and
            .data.repository.release.isLatest == false and
            (.data.repository.release.tagName | type == "string") and
            (.data.repository.release.tagCommit.oid | type == "string")
          ' <<< "$DISCOVERY" >/dev/null
          RELEASE_ID="$(jq -r '.data.repository.release.databaseId' <<< "$DISCOVERY")"
          test "$(jq -r '.data.repository.release.tagName' <<< "$DISCOVERY")" = "$TAG"
          test "$(jq -r '.data.repository.release.tagCommit.oid' <<< "$DISCOVERY")" = "$GITHUB_SHA"
          RELEASE_JSON="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          )"
          test "$(jq -er '.id' <<< "$RELEASE_JSON")" = "$RELEASE_ID"
          test "$(jq -er '.tag_name' <<< "$RELEASE_JSON")" = "$TAG"
          test "$(jq -er '.draft' <<< "$RELEASE_JSON")" = true
          test "$(jq -er '.prerelease' <<< "$RELEASE_JSON")" = false
          TARGET="$(jq -er '.target_commitish' <<< "$RELEASE_JSON")"
          RESOLVED_TARGET="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET" --jq '.sha'
          )"
          test "$RESOLVED_TARGET" = "$GITHUB_SHA"

          EXPECTED_ASSET_COUNT=15
          cat > "$RUNNER_TEMP/expected-release-assets" <<'EOF'
          car-go-clean-aarch64-apple-darwin.tar.xz
          car-go-clean-aarch64-apple-darwin.tar.xz.sha256
          car-go-clean-aarch64-unknown-linux-musl.tar.xz
          car-go-clean-aarch64-unknown-linux-musl.tar.xz.sha256
          car-go-clean-installer.sh
          car-go-clean-shell-assets.sha256
          car-go-clean-upgrade.sh
          car-go-clean-x86_64-apple-darwin.tar.xz
          car-go-clean-x86_64-apple-darwin.tar.xz.sha256
          car-go-clean-x86_64-unknown-linux-musl.tar.xz
          car-go-clean-x86_64-unknown-linux-musl.tar.xz.sha256
          car-go-clean.rb
          sha256.sum
          source.tar.gz
          source.tar.gz.sha256
          EOF
          sed 's/^          //' "$RUNNER_TEMP/expected-release-assets" |
            LC_ALL=C sort > "$RUNNER_TEMP/expected-release-assets.sorted"
          jq -er '.assets[].name' <<< "$RELEASE_JSON" |
            LC_ALL=C sort > "$RUNNER_TEMP/actual-release-assets"
          test "$(wc -l < "$RUNNER_TEMP/actual-release-assets" | tr -d ' ')" \
            -eq "$EXPECTED_ASSET_COUNT"
          cmp "$RUNNER_TEMP/expected-release-assets.sorted" \
            "$RUNNER_TEMP/actual-release-assets"
          printf 'release_id=%s\n' "$RELEASE_ID" >> "$GITHUB_OUTPUT"

  smoke:
    name: Authenticated draft smoke (${{ matrix.target }})
    needs: inventory
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            expected_uname: arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            expected_uname: x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            expected_uname: aarch64
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            expected_uname: x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download authenticated draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ inputs.plan }}
          ASSET_DIR: ${{ runner.temp }}/draft-release-assets
        run: |
          set -eu
          TAG="$(jq -er '.announcement_tag | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<< "$PLAN")"
          mkdir -p "$ASSET_DIR"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'car-go-clean-*.tar.xz' \
            --pattern 'car-go-clean-*.tar.xz.sha256' \
            --pattern 'car-go-clean-installer.sh' \
            --pattern 'car-go-clean-upgrade.sh' \
            --pattern 'car-go-clean-shell-assets.sha256' \
            --pattern 'car-go-clean.rb' \
            --pattern 'sha256.sum' \
            --pattern 'source.tar.gz' \
            --pattern 'source.tar.gz.sha256' \
            --dir "$ASSET_DIR"
      - name: Verify authenticated draft install paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ inputs.plan }}
          TARGET: ${{ matrix.target }}
          EXPECTED_UNAME: ${{ matrix.expected_uname }}
          ASSET_DIR: ${{ runner.temp }}/draft-release-assets
          ISOLATED_ROOT: ${{ runner.temp }}/car-go-clean-draft-smoke
        run: |
          set -euo pipefail
          TAG="$(jq -er '.announcement_tag | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<< "$PLAN")"
          VERSION="${TAG#v}"
          test "$(uname -m)" = "$EXPECTED_UNAME"
          scripts/verify-release-assets.sh "$TAG" "$ASSET_DIR" \
            > "$RUNNER_TEMP/draft-release-inventory.tsv"
          scripts/verify-shell-release-assets.sh "$ASSET_DIR" \
            > "$RUNNER_TEMP/draft-shell-inventory.tsv"

          archive="car-go-clean-$TARGET.tar.xz"
          for attested_asset in \
            "$archive" \
            car-go-clean-installer.sh \
            car-go-clean-upgrade.sh \
            car-go-clean-shell-assets.sha256 \
            car-go-clean.rb \
            sha256.sum \
            source.tar.gz \
            source.tar.gz.sha256
          do
            gh attestation verify "$ASSET_DIR/$attested_asset" \
              --repo "$GITHUB_REPOSITORY"
          done

          rm -rf "$ISOLATED_ROOT"
          mkdir -p \
            "$ISOLATED_ROOT/extracted" \
            "$ISOLATED_ROOT/formula-tap/Formula" \
            "$ISOLATED_ROOT/home" \
            "$ISOLATED_ROOT/installed/bin" \
            "$ISOLATED_ROOT/projects" \
            "$ISOLATED_ROOT/state"
          tar -xJf "$ASSET_DIR/$archive" -C "$ISOLATED_ROOT/extracted"
          binary=$(find "$ISOLATED_ROOT/extracted" -type f -name car-go-clean -perm -111)
          test "$(printf '%s\n' "$binary" | awk 'NF {count++} END {print count + 0}')" -eq 1
          version_output=$("$binary" version)
          test "$version_output" = "$VERSION"
          printf 'scan_dirs = ["%s"]\n' "$ISOLATED_ROOT/projects" \
            > "$ISOLATED_ROOT/config.toml"
          HOME="$ISOLATED_ROOT/home" \
            XDG_CONFIG_HOME="$ISOLATED_ROOT/home/.config" \
            XDG_STATE_HOME="$ISOLATED_ROOT/home/.local/state" \
            "$binary" health --skip-cargo \
              --config "$ISOLATED_ROOT/config.toml" \
              --state-dir "$ISOLATED_ROOT/state"

          (
            cd "$ASSET_DIR"
            CAR_GO_CLEAN_ALLOW_INSECURE_TEST_URL=1 \
              HOME="$ISOLATED_ROOT/home" \
              sh ./car-go-clean-installer.sh \
                --version "$VERSION" \
                --install-dir "$ISOLATED_ROOT/installed/bin" \
                --download-base-url "file://$ASSET_DIR"
          )
          test "$("$ISOLATED_ROOT/installed/bin/car-go-clean" version)" = "$VERSION"
          test ! -e "$ISOLATED_ROOT/home/Library/LaunchAgents/com.dcchuck.car-go-clean.plist"
          test ! -e "$ISOLATED_ROOT/home/.config/systemd/user/car-go-clean.service"
          test ! -e "$HOME/Library/LaunchAgents/com.dcchuck.car-go-clean.plist"
          test ! -e "$HOME/.config/systemd/user/car-go-clean.service"

          scripts/render-local-homebrew-formula.sh \
            "$TAG" \
            "$ASSET_DIR" \
            "$ISOLATED_ROOT/formula-tap/Formula/car-go-clean.rb" \
            "file://$ASSET_DIR"
          if test "$(uname -s)" = Darwin
          then
            export HOMEBREW_NO_AUTO_UPDATE=1
            export HOMEBREW_NO_INSTALL_CLEANUP=1
            FORMULA_TAP=car-go-clean/release-smoke
            git -C "$ISOLATED_ROOT/formula-tap" init -q -b main
            git -C "$ISOLATED_ROOT/formula-tap" config user.name "Release smoke"
            git -C "$ISOLATED_ROOT/formula-tap" config user.email actions@users.noreply.github.com
            git -C "$ISOLATED_ROOT/formula-tap" config commit.gpgsign false
            git -C "$ISOLATED_ROOT/formula-tap" add Formula/car-go-clean.rb
            git -C "$ISOLATED_ROOT/formula-tap" commit -qm "local release formula"
            cleanup() {
              brew uninstall --force car-go-clean >/dev/null 2>&1 || true
              brew untap "$FORMULA_TAP" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT HUP INT TERM
            brew tap --custom-remote "$FORMULA_TAP" "$ISOLATED_ROOT/formula-tap"
            brew install car-go-clean/release-smoke/car-go-clean
            brew test car-go-clean
            brew_binary="$(brew --prefix car-go-clean)/bin/car-go-clean"
            test "$("$brew_binary" version)" = "$VERSION"
          else
            ruby -c "$ISOLATED_ROOT/formula-tap/Formula/car-go-clean.rb"
          fi
          test ! -e "$ISOLATED_ROOT/home/Library/LaunchAgents/com.dcchuck.car-go-clean.plist"
          test ! -e "$ISOLATED_ROOT/home/.config/systemd/user/car-go-clean.service"
          test ! -e "$HOME/Library/LaunchAgents/com.dcchuck.car-go-clean.plist"
          test ! -e "$HOME/.config/systemd/user/car-go-clean.service"
