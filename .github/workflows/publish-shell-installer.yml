name: Publish shell installer

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-shell-installer:
    runs-on: ubuntu-22.04
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Read release tag
        run: |
          TAG="$(jq -er '.announcement_tag | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<< "$PLAN")"
          printf 'TAG=%s\n' "$TAG" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage installer
        run: cp packaging/release/car-go-clean-installer.sh car-go-clean-installer.sh
      - name: Attest installer
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: car-go-clean-installer.sh
      - name: Upload installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" car-go-clean-installer.sh --clobber
